# nginx: отдача страницы «Что залетело» (борды залёта) — статический HTML.
#
# Это location-блок, который вставляют ВНУТРЬ уже существующего server{}
# (например, в том же server{}, где отдаётся HypeParser по /hype/). Схема
# защиты та же, что у HypeParser: basic-auth, ограничение частоты, noindex.
#
# Установка:
#   1) объявить зону ограничения частоты (limit_req_zone допустима только в
#      контексте http{} — кладём отдельным файлом в conf.d):
#          cat > /etc/nginx/conf.d/boards-zone.conf <<'EOF'
#          limit_req_zone $binary_remote_addr zone=boards:10m rate=30r/m;
#          EOF
#   2) положить этот блок в нужный server{}:
#          include /root/tuber/deploy/boards.conf;
#   3) создать файл паролей:
#          printf 'boards:' > /etc/nginx/.htpasswd_boards
#          openssl passwd -apr1 >> /etc/nginx/.htpasswd_boards
#          chmod 640 /etc/nginx/.htpasswd_boards
#          chown root:www-data /etc/nginx/.htpasswd_boards
#   4) собрать страницу генератором:
#          python3 /root/tuber/tools/build_boards.py
#   5) nginx -t && systemctl reload nginx
#
# Страница полностью статичная (без скриптов и внешних ресурсов), поэтому
# nginx отдаёт её файлом — никакого прокси и приложения не нужно.

# Редирект /boards -> /boards/ (иначе alias не сработает).
location = /boards {
    return 301 /boards/;
}

location /boards/ {
    # Ограничитель частоты: 30r/m + запас burst=10 без задержек.
    limit_req zone=boards burst=10 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    # Закрываем страницу логином/паролем.
    auth_basic "Что залетело";
    auth_basic_user_file /etc/nginx/.htpasswd_boards;

    # Запрет индексации (заголовком; в самой странице уже есть <meta robots>)
    # и защита от подмены типа содержимого.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Каталог, куда генератор кладёт index.html и boards.json.
    alias /root/tuber/reports/boards/;
    index index.html;
    try_files $uri $uri/ =404;

    # HTML и JSON — UTF-8; статика без кэша, чтобы свежая сборка сразу была видна.
    charset utf-8;
    add_header Cache-Control "no-store" always;
}
