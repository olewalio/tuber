# Зона ограничения частоты для страницы HypeParser.
#
# Кладём этот файл в /etc/nginx/conf.d/hype-zone.conf:
#   cp /root/tuber/deploy/nginx-zone-hype.conf /etc/nginx/conf.d/hype-zone.conf
#
# Почему отдельным файлом: conf.d/*.conf подключается ВНУТРИ http{}, а
# limit_req_zone допустима только в контексте http{}. Так зона объявляется без
# правки основного /etc/nginx/nginx.conf; удаление файла убирает зону.
limit_req_zone $binary_remote_addr zone=hype:10m rate=30r/m;
