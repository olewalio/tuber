# Общая часть страницы HypeParser: подключается и в :80, и в :443.
# Кладём в /etc/nginx/snippets/hype-shared.conf
#     cp /root/tuber/deploy/nginx-hype-shared.conf /etc/nginx/snippets/hype-shared.conf
# Файл рассчитан на включение ВНУТРЬ server{} (`include snippets/hype-shared.conf;`).

    # Не светим версию nginx.
    server_tokens off;

    # Закрываем страницу логином/паролем.
    auth_basic "HypeParser";
    auth_basic_user_file /etc/nginx/.htpasswd_hype;

    # Запрет индексации (и в <meta>, и заголовком) + защита от подмены типа.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /hype/ {
        # Ограничитель частоты: 30r/m + запас burst=10 без задержек.
        limit_req zone=hype burst=10 nodelay;
        # Отдавать 429 (как делает приложение), а не 503 по умолчанию.
        limit_req_status 429;
        limit_req_log_level warn;

        # Слэш на конце proxy_pass срезает префикс /hype/:
        #   /hype/         -> /
        #   /hype/search   -> /search
        #   /hype/healthz  -> /healthz
        proxy_pass http://127.0.0.1:8730/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Поиск может занять до 180 с (потолок приложения) — не рвём раньше.
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    # Всё остальное на этом адресе закрыто: доступна только /hype/.
    location / {
        return 404;
    }
