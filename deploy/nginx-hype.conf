# nginx: два server-блока для страницы HypeParser — открытый :80 (только
# проверка владения доменом для Let's Encrypt) и шифрованный :443.
#
# СНАЧАЛА объявите зону ограничения частоты — отдельным файлом в conf.d
# (conf.d подключается ВНУТРИ http{}, где limit_req_zone только и допустима):
#     cp deploy/nginx-zone-hype.conf /etc/nginx/conf.d/hype-zone.conf
# Без неё `nginx -t` скажет `unknown limit_req_zone "hype"`.
#
# Установка:
#     cp deploy/nginx-hype-shared.conf /etc/nginx/snippets/hype-shared.conf
#     cp deploy/nginx-hype.conf /etc/nginx/sites-available/hype.conf
#     ln -s /etc/nginx/sites-available/hype.conf /etc/nginx/sites-enabled/zz-hype.conf
#     nginx -t && systemctl reload nginx
#
# Имя симлинка — zz-hype.conf (НЕ hype.conf): sites-enabled/*.conf читается по
# алфавиту, и первый блок становится сервером по умолчанию для :80, перехватывая
# чужие виртуальные хосты. prop-rate обязан остаться первым.
#
# Сертификат (webroot, без плагина nginx):
#     certbot certonly --webroot -w /var/www/acme-challenge \
#       -d <server_host>.sslip.io --deploy-hook "systemctl reload nginx"
# Файлы сертификата: /etc/letsencrypt/live/<server_host>.sslip.io/
#
# server_name — конкретный адрес, а не `_` и не default_server: существующий
# сайт prop-rate не трогаем и не перебиваем.

server {
    listen 80;
    server_name <server_host> <server_host>.sslip.io;

    access_log /var/log/nginx/hype.access.log;
    error_log  /var/log/nginx/hype.error.log warn;

    # Проверка владения доменом для Let's Encrypt (сюда кладёт файлы certbot).
    # Пароль здесь снят, иначе проверка не пройдёт. Больше на :80 ничего нет.
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        auth_basic off;
        allow all;
    }

    # Всё остальное на :80 — только переброс на шифрованный вход.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name <server_host> <server_host>.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/<server_host>.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<server_host>.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:HYPE:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/hype.access.log;
    error_log  /var/log/nginx/hype.error.log warn;

    include snippets/hype-shared.conf;
}
